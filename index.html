<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <style>
        /* 載入高質感變數字型 */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,100..900;1,100..900&display=swap');

        :root {
            font-family: "Reference Sans", "Plus Jakarta Sans", Arial, sans-serif;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景圖片與陰影設定 */
        .background {
            position: absolute;
            inset: 0;
            z-index: -3;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            pointer-events: none;
            user-select: none;
            opacity: 0.4;
        }

        /* 影片/畫面暗角漸層 */
        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background: 
                linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
                radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }

        /* 精準調整的英雄大標題 */
        .hero-title {
            font-family: "Reference Display", "Reference Sans", "Plus Jakarta Sans", Arial, sans-serif;
            font-weight: 500;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-optical-sizing: auto;
            letter-spacing: -2.1px;
            -webkit-text-stroke: 0.12px currentColor;
            white-space: nowrap;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>
<body class="screen">
    <!-- 背景裝飾圖或漸層 -->
    <div class="container">
        <h1 class="hero-title">用設計與技術創造卓越</h1>
        <p class="hero-subtitle">歡迎來到我的 GitHub 個人網站，精彩內容即將登場。</p>
        <a href="https://github.com/BK20367" target="_blank" class="btn">了解更多</a>
    </div>
</body>
</html>
